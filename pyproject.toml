[project]
name = "groundkit"
version = "0.1.0"
description = "Бесплатные LLM + веб-поиск с проверяемыми цитатами и белым списком доменов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ernest" }]
keywords = ["llm", "web-search", "rag", "citations", "searxng", "litellm", "free-tier"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "litellm>=1.84.0",
]

[project.urls]
Homepage = "https://github.com/2001092236/groundkit"
Demo = "https://2001092236.github.io/groundkit/"

[project.optional-dependencies]
ddg = ["ddgs>=9.0"]
extract = ["trafilatura>=1.12"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
spaces = ["gradio_client>=1.5"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "ddgs>=9.0", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]

[project.scripts]
groundkit = "groundkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundkit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: обращается к реальным сервисам; включается GROUNDKIT_LIVE=1"]
