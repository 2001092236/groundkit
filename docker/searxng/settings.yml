# Минимальные настройки SearXNG для groundkit: JSON-вывод включён, лимитер выключен
# (инстанс не торчит наружу — его видит только контейнер api).
use_default_settings: true

general:
  instance_name: "groundkit-search"
  enable_metrics: false

server:
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru"
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: yandex
    disabled: true
