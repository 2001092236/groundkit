name: Deploy demo page

on:
  push:
    branches: [main]
    paths: ["docs/**", "groundkit/web/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать статическую страницу
        run: |
          mkdir -p _site
          cp groundkit/web/static/index.html _site/index.html
          cp -r docs/assets _site/assets 2>/dev/null || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
